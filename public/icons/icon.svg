<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090D16"/>
  <circle cx="256" cy="256" r="210" stroke="#1E293B" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" stroke="#06B6D4" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Outer Watch Bezel -->
  <circle cx="256" cy="256" r="150" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  
  <!-- Dial markers -->
  <line x1="256" y1="120" x2="256" y2="136" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="376" x2="256" y2="392" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="256" x2="136" y2="256" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="376" y1="256" x2="392" y2="256" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Glowing Watchface Center Elements (Active + AOD union) -->
  <circle cx="256" cy="256" r="48" fill="#0284C7" fill-opacity="0.2" stroke="#0EA5E9" stroke-width="3"/>
  <text x="256" y="244" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="2">FAOD</text>
  <text x="256" y="274" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">10:08</text>
  
  <!-- Watch Hands -->
  <line x1="256" y1="256" x2="310" y2="200" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="210" y2="160" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="8" fill="#F8FAFC"/>
  
  <!-- Badge -->
  <rect x="176" y="324" width="160" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="256" y="343" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ZEPP OS READY</text>
</svg>
